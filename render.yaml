# Render Blueprint. Both services stay on the $0 free plan (512 MB).
# Free instances sleep after about 15 minutes of quiet. Gemma does not run
# here: the hosted API scores with Groq, then the heuristic scorecard.
services:
  - type: web
    name: echohire-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: echohire-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: echohire-api
          envVarKey: RENDER_EXTERNAL_URL
